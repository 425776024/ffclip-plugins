<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VideoCut GSAP lower third · 1920 × 1080 · 5 seconds</title>
    <style>
      :root { --accent: #34d1bf; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
      body { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; color: #f9fbff; }
      .lower-third { position: absolute; left: 112px; bottom: 108px; width: 840px; }
      .panel { position: relative; padding: 38px 46px 42px; border: 1px solid #ffffff24;
        border-radius: 20px; background: #101723ed; box-shadow: 0 16px 48px #00000030; overflow: hidden; }
      .eyebrow { color: var(--accent); font-size: 24px; font-weight: 700; letter-spacing: 5px; }
      .title { margin: 15px 0 12px; font-size: 58px; font-weight: 750; line-height: 1.18;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .subtitle { margin: 0; color: #c8d2df; font-size: 27px; line-height: 1.5;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .progress { position: absolute; left: 0; bottom: 0; height: 5px; width: 0; background: var(--accent); }
    </style>
  </head>
  <body>
    <section class="lower-third">
      <div class="panel">
        <div class="eyebrow">VIDEOCUT</div>
        <h1 class="title">让画面说话</h1>
        <p class="subtitle">HTML 动画 · 本地视频 · 同一条时间轴</p>
        <div class="progress"></div>
      </div>
    </section>
    <script>
      // VideoCut injects GSAP and variables before this script. No CDN is needed.
      window.__videocutReady = Promise.resolve().then(() => {
        const variables = window.__videocutVariables || {};
        if (typeof variables.title === "string") document.querySelector(".title").textContent = variables.title;
        if (typeof variables.subtitle === "string") document.querySelector(".subtitle").textContent = variables.subtitle;
        if (typeof variables.eyebrow === "string") document.querySelector(".eyebrow").textContent = variables.eyebrow;
        if (typeof variables.accent === "string" && CSS.supports("color", variables.accent))
          document.documentElement.style.setProperty("--accent", variables.accent);

        // Avoid automatic GPU layer promotion changing 2D shadow/border rasterization after seeks.
        gsap.defaults({ force3D: false });
        const timeline = gsap.timeline({ paused: true });
        timeline.fromTo(".lower-third", { x: -96, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 0);
        timeline.fromTo(".eyebrow", { y: 10, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.35, ease: "power2.out" }, 0.12);
        timeline.fromTo(".title", { y: 24, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.48, ease: "power3.out" }, 0.18);
        timeline.fromTo(".subtitle", { y: 16, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, 0.3);
        timeline.to(".lower-third", { y: 20, opacity: 0, duration: 0.5, ease: "power2.in" }, 4.5);
        window.__timelines["lower-third"] = timeline;
      });

      // Direct updates also derive from absolute time, so reverse seeks are stable.
      window.tick = function (seconds, context) {
        const progress = Math.max(0, Math.min(1, seconds / context.duration));
        document.querySelector(".progress").style.width = `${progress * 100}%`;
      };
    </script>
  </body>
</html>
