<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Momentum data story</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#142d29;color:#f2f2e8;font-family:Arial,Helvetica,sans-serif}.stage{position:absolute;width:1280px;height:720px;transform-origin:top left}.top{position:absolute;left:64px;right:64px;top:45px;display:flex;justify-content:space-between;font-size:16px;letter-spacing:2px}.label{color:#b9d697}.badge{font-size:12px;border:1px solid #567467;border-radius:30px;padding:8px 14px;margin-top:-6px;color:#b8c8bb}.line{position:absolute;left:64px;top:94px;width:1152px;height:1px;background:#436052}h1{position:absolute;left:60px;top:142px;margin:0;font-size:72px;line-height:1.08;letter-spacing:-3px;font-weight:600}h1 em{color:#c6e59b;font-style:normal}.sub{position:absolute;left:64px;top:339px;font-size:21px;line-height:1.6;color:#aec3b6}.metric{position:absolute;left:64px;top:451px;font-size:96px;letter-spacing:-5px}.metric-label{position:absolute;left:68px;top:566px;color:#b6c9ba;font-size:16px;letter-spacing:1px}.chart{position:absolute;left:605px;top:178px;width:600px;height:402px}.grid{position:absolute;left:0;right:0;border-top:1px dashed #496456}.g0{bottom:42px}.g1{bottom:142px}.g2{bottom:242px}.g3{bottom:342px}.bar{position:absolute;bottom:42px;width:94px;border-radius:9px 9px 0 0;background:#c6e59b;transform-origin:bottom;min-height:4px}.bar:nth-of-type(6){background:#96b77b}.bar:nth-of-type(7){background:#accd8b}.number{position:absolute;left:0;right:0;top:-41px;text-align:center;font-size:27px;letter-spacing:-1px}.quarter{position:absolute;bottom:-35px;left:0;right:0;text-align:center;font-size:15px;color:#aac0b1}.footer{position:absolute;left:64px;right:64px;top:634px;border-top:1px solid #436052;padding-top:19px;display:flex;justify-content:space-between;color:#a9bfaf;font-size:14px;letter-spacing:1px}.spark{display:inline-block;width:8px;height:8px;border-radius:50%;background:#c6e59b;margin-right:9px}.progress{position:absolute;left:0;bottom:0;height:5px;background:#c6e59b}
</style></head><body><main class="stage">
<div class="top"><span class="label">VIDEOCUT / DATA STORIES</span><span class="badge">ILLUSTRATIVE DATA</span></div><div class="line"></div><h1>Small steps.<br><em>Big momentum.</em></h1><div class="sub">Four chapters.<br>One upward story.</div><div class="metric">0<span style="font-size:40px;letter-spacing:0">%</span></div><div class="metric-label">Q4 · COMPLETION</div>
<div class="chart"><div class="grid g0"></div><div class="grid g1"></div><div class="grid g2"></div><div class="grid g3"></div><div class="bar" style="left:14px"><span class="number">24</span><span class="quarter">Q1</span></div><div class="bar" style="left:162px"><span class="number">48</span><span class="quarter">Q2</span></div><div class="bar" style="left:310px"><span class="number">72</span><span class="quarter">Q3</span></div><div class="bar" style="left:458px"><span class="number">96</span><span class="quarter">Q4</span></div></div>
<div class="footer"><span><i class="spark"></i>TURN NUMBERS INTO A STORY</span><span>HTML / EDITABLE VALUES</span></div><div class="progress"></div></main><script>
const vars=window.variables||{},values=[vars.q1??24,vars.q2??48,vars.q3??72,vars.q4??96],bars=[...document.querySelectorAll('.bar')],ease=x=>1-Math.pow(1-Math.max(0,Math.min(1,x)),3);
window.tick=(t,context)=>{
 document.querySelector('.stage').style.transform=`scale(${context.width/1280})`;
 bars.forEach((el,i)=>{const p=ease((t-.4-i*.4)/1.8);el.style.height=`${values[i]*3.1*p+4}px`;el.querySelector('.number').textContent=Math.round(values[i]*p)+'%';});
 document.querySelector('.metric').innerHTML=Math.round(values[3]*ease((t-.4)/3.0))+'<span style="font-size:40px;letter-spacing:0">%</span>';
 document.querySelector('h1').style.transform=`translateY(${(1-ease(t/.8))*25}px)`;
 document.querySelector('.progress').style.width=`${Math.min(1,t/context.duration)*100}%`;
};
</script></body></html>
